name: Keep Streamlit Apps Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit apps
        run: |
          wget --timeout=60 --tries=2 --spider https://harmonic-sequence-demo.streamlit.app/ || true
          wget --timeout=60 --tries=2 --spider https://topo-explorer.streamlit.app/ || true