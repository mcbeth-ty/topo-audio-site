name: Keep Streamlit Apps Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit apps
        run: |
          curl -L --max-time 60 https://harmonic-sequence-demo.streamlit.app/
          curl -L --max-time 60 https://topo-explorer.streamlit.app/